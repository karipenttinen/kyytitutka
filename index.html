<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyytitutka – Kunnon Taksi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }
  body { background: #09090B; color: #F2F2ED; }
  .wrap { max-width: 480px; margin: 0 auto; padding-bottom: 40px; position: relative; overflow: hidden; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .glow {
    position: absolute; top: -140px; left: 50%; transform: translateX(-50%);
    width: 460px; height: 340px; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at center, rgba(255,244,84,0.13) 0%, rgba(255,244,84,0) 70%);
  }

  .watermark {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 340px; height: 340px; object-fit: contain;
    opacity: 0.11; z-index: 0; pointer-events: none;
  }

  .header { position: relative; z-index: 1; padding: 24px 16px 16px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand-logo { width: 50px; height: 50px; flex-shrink: 0; filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55)); }
  .title { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 21px; letter-spacing: -0.3px; }
  .subtitle { color: #C7C7CD; font-size: 13px; margin-top: 2px; font-weight: 500; }
  .clock { color: #FFF454; font-size: 15px; text-align: right; }
  .date-line { color: #C7C7CD; font-size: 13.5px; margin-top: 1px; font-weight: 600; text-align: right; }

  .stripe {
    height: 4px; margin: 0 16px 18px; border-radius: 999px; opacity: 0.4; position: relative; z-index: 1;
    background: repeating-linear-gradient(120deg, #FFF454 0px, #FFF454 9px, transparent 9px, transparent 18px);
  }

  .hero {
    position: relative; z-index: 1; margin: 0 16px 18px; padding: 6px 20px 8px 22px;
    background: linear-gradient(160deg, #1D1D22 0%, #100F11 100%);
    border: 1px solid #2C2C31;
    box-shadow: 0 14px 34px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%);
  }
  .hero::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #FFF454; }
  .hero-eta { color: #C7C7CD; font-size: 12.5px; margin: 12px 0 3px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
  .hero-item { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid #232327; }
  .hero-item:first-of-type { border-top: none; }
  .hero-num { font-family: 'JetBrains Mono', monospace; font-size: 23px; font-weight: 700; color: #FFF454; letter-spacing: -0.5px; min-width: 48px; flex-shrink: 0; }
  .hero-num.mid { font-size: 17px; min-width: 64px; }
  .hero-num.clock { font-size: 19px; min-width: 64px; }
  .hero-num.clock.small { font-size: 15px; min-width: 74px; }
  .hero-num .unit { font-size: 10px; font-weight: 700; opacity: 0.7; margin-left: 2px; }
  .hero-info { flex: 1; min-width: 0; }
  .hero-icon-row { display: flex; align-items: center; gap: 7px; }
  .hero-icon { font-size: 15px; }
  .hero-title { font-weight: 800; font-size: 15px; color: #FBFBF8; }
  .hero-detail { color: #DADADE; font-size: 14px; margin-top: 3px; line-height: 1.4; }
  .loc { display: flex; align-items: center; gap: 4px; color: #C0C0C6; font-size: 13.5px; }

  .stat { position: relative; z-index: 1; padding: 0 16px 14px; color: #C0C0C6; font-size: 14px; }

  .tabs { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 18px; }
  .tab {
    width: 100%; padding: 10px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.1px;
    white-space: nowrap; border: 1px solid #232327; color: #C7C7CD; background: #131315; text-align: center;
  }
  .tab.active {
    border-color: #FFF454; color: #0A0A0B; background: #FFF454;
    box-shadow: 0 4px 14px rgba(255,244,84,0.25);
  }

  .category-label { padding: 20px 16px 4px; font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: 0.3px; color: #FFF454; border-top: 1px solid #232327; margin-top: 4px; }
  .band-label { padding: 12px 16px 7px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
  .list { border-top: 1px solid #1C1C20; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px 13px 14px; border-bottom: 1px solid #1C1C20; border-left: 3px solid transparent; }
  .row.soon { background: rgba(255,244,84,0.055); border-left-color: #FFF454; }
  .row-time { min-width: 68px; font-size: 20px; padding-top: 1px; color: #FFF454; font-weight: 600; }
  .row-time.range { font-size: 14px; min-width: 76px; line-height: 1.25; padding-top: 4px; }
  .row-time.withday { font-size: 15px; min-width: 76px; }
  .row.soon .row-icon { color: #FFF454; }
  .row-icon { padding-top: 3px; font-size: 16px; color: #C0C0C6; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-weight: 700; font-size: 16.7px; color: #F2F2ED; }
  .row-detail { color: #DADADE; font-size: 17px; margin-top: 3px; line-height: 1.35; }
  .row-loc { display: flex; align-items: center; gap: 4px; color: #B5B5BB; font-size: 15px; margin-top: 5px; }

  .empty { padding: 32px 16px; color: #C0C0C6; font-size: 15px; text-align: center; }

  .gate { position: fixed; inset: 0; background: #09090B; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate-box { max-width: 320px; width: 100%; text-align: center; }
  .gate-logo { width: 110px; height: 110px; margin-bottom: 16px; }
  .gate-title { font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 0.5px; }
  .gate-wordmark { width: 210px; margin: 14px 0 28px; }
  .gate-input {
    width: 100%; padding: 13px 16px; border-radius: 999px; border: 1px solid #29292E; background: #141416;
    color: #F2F2ED; font-size: 15px; text-align: center; margin-bottom: 12px;
  }
  .gate-input:focus { outline: none; border-color: #FFF454; }
  .gate-btn {
    width: 100%; padding: 13px 16px; border-radius: 999px; border: none; background: #FFF454;
    color: #0A0A0B; font-weight: 800; font-size: 15px;
  }
  .gate-error { color: #FF6B6B; font-size: 13px; margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-box">
    <img src="logo.png" alt="" class="gate-logo">
    <div class="gate-title">KYYTITUTKA</div>
    <img src="logo-wordmark.png" alt="Kunnon Taksi" class="gate-wordmark">
    <input type="password" id="gatePw" class="gate-input" placeholder="Salasana" autocomplete="off">
    <button class="gate-btn" id="gateBtn">Kirjaudu</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>
<div class="wrap" id="app" style="display:none">
  <div class="glow"></div>
  <img src="logo.png" alt="" class="watermark">
  <div class="header">
    <div class="brand">
      <img src="logo.png" alt="Kunnon Taksi" class="brand-logo">
      <div>
        <div class="title">KYYTITUTKA</div>
        <div class="subtitle" id="subtitle">Kunnon Taksi · Tampere</div>
      </div>
    </div>
    <div>
      <div class="clock mono" id="clock">--.--.--</div>
      <div class="date-line" id="dateLine">--</div>
    </div>
  </div>
  <div class="stripe"></div>

  <div id="hero-slot"></div>
  <div class="stat" id="stat-line"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list-slot"><div class="empty">Ladataan…</div></div>
</div>

<script>
const TYPE_META = {
  lento: { icon: '✈' },
  juna: { icon: '🚆' },
  bussi: { icon: '🚌' },
  tapahtuma: { icon: '🎉' },
};

const FILTERS = [
  { id: 'kaikki', label: 'Kaikki' },
  { id: 'lennot', label: 'Lennot' },
  { id: 'kaukoliikenne', label: 'Kaukoliikenne' },
  { id: 'tapahtumat', label: 'Tapahtumat' },
];

function matchesFilter(type, f) {
  if (f === 'kaikki') return true;
  if (f === 'lennot') return type === 'lento';
  if (f === 'kaukoliikenne') return type === 'juna' || type === 'bussi';
  if (f === 'tapahtumat') return type === 'tapahtuma';
  return true;
}

function getBand(delta) {
  if (delta <= -480) return null;
  if (delta <= 300) return 'nyt';
  if (delta <= 1500) return 'pian';
  if (delta <= 4500) return 'tunti';
  return 'myohemmin';
}
const BAND_ORDER = ['nyt', 'pian', 'tunti', 'myohemmin'];
const BAND_LABEL = { nyt: 'Juuri nyt', pian: 'Hyvin pian', tunti: 'Seuraavan tunnin aikana', myohemmin: 'Myöhemmin' };
const BAND_COLOR = { nyt: '#FFF454', pian: '#FFF454', tunti: '#9B9BA0', myohemmin: '#6C6C71' };

let rawData = [];
let filter = 'kaikki';

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function fmtTime(unixSec) {
  const d = new Date(unixSec * 1000);
  return String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');
}

function isSameDay(unixSec, ref) {
  const a = new Date(unixSec * 1000);
  const b = new Date(ref * 1000);
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

// Sama kellonaika eri päivänä (esim. huomenna) voi näyttää siltä kuin se olisi
// jo mennyt ohi tänään, jos näytetään vain "HH.MM" ilman päivää - lisätään
// viikonpäivälyhenne eteen aina kun kyseessä ei ole tämä päivä.
function fmtTimeWithDay(unixSec) {
  const now = Math.floor(Date.now() / 1000);
  const aika = fmtTime(unixSec);
  if (isSameDay(unixSec, now)) return aika;
  const paiva = new Intl.DateTimeFormat('fi-FI', { weekday: 'short' }).format(new Date(unixSec * 1000));
  return `${paiva} ${aika}`;
}

function heroTimeHtml(item) {
  if (item.delta <= 0) return `<div class="hero-num">NYT</div>`;
  const minutes = Math.round(item.delta / 60);
  if (minutes < 60) {
    return `<div class="hero-num">${minutes}<span class="unit">min</span></div>`;
  }
  if (minutes < 180) {
    const h = Math.floor(minutes / 60);
    const m = String(minutes % 60).padStart(2, '0');
    return `<div class="hero-num mid">${h}h ${m}<span class="unit">min</span></div>`;
  }
  return `<div class="hero-num clock small mono">${fmtTimeWithDay(item.time)}</div>`;
}

function render() {
  const now = Math.floor(Date.now() / 1000);
  document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8).replace(/:/g, '.');
  document.getElementById('dateLine').textContent = new Intl.DateTimeFormat('fi-FI', {
    weekday: 'short', day: 'numeric', month: 'numeric',
  }).format(new Date());

  const withDelta = rawData
    .map((s) => ({ ...s, delta: s.time - now }))
    .filter((s) => getBand(s.delta) !== null);

  const filtered = withDelta.filter((s) => matchesFilter(s.type, filter)).sort((a, b) => a.delta - b.delta);
  const heroItems = filtered.slice(0, 3);
  const rest = filtered.slice(3);

  document.getElementById('stat-line').textContent =
    withDelta.filter((s) => s.delta <= 4500).length + ' seuraavan tunnin sisällä';

  document.getElementById('tabs').innerHTML = FILTERS.map((f) =>
    `<button class="tab ${f.id === filter ? 'active' : ''}" data-f="${f.id}">${f.label}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));

  document.getElementById('hero-slot').innerHTML = heroItems.length
    ? `<div class="hero">
        <div class="hero-eta">Seuraavaksi</div>
        ${heroItems
          .map(
            (item) => `
            <div class="hero-item">
            ${heroTimeHtml(item)}
            <div class="hero-info">
              <div class="hero-icon-row">
                <span class="hero-icon">${TYPE_META[item.type]?.icon || '•'}</span>
                <span class="hero-title">${esc(item.title)}</span>
              </div>
              <div class="hero-detail">${esc(item.detail)}</div>
              <div class="loc">📍 ${esc(item.location)}</div>
            </div>
          </div>`
          )
          .join('')}
      </div>`
    : '';

  function bandGroupsHtml(items) {
    const grouped = BAND_ORDER.map((band) => ({ band, items: items.filter((s) => getBand(s.delta) === band) })).filter(
      (g) => g.items.length > 0
    );
    return grouped
      .map(
        (g) => `
      <div class="band-label" style="color:${BAND_COLOR[g.band]}">${BAND_LABEL[g.band]}</div>
      <div class="list">
        ${g.items
          .map(
            (s) => `
          <div class="row ${s.delta <= 300 ? 'soon' : ''}">
            <div class="row-time mono${s.timeLabel ? ' range' : (fmtTimeWithDay(s.time).includes(' ') ? ' withday' : '')}">${esc(s.timeLabel || fmtTimeWithDay(s.time))}</div>
            <div class="row-icon">${TYPE_META[s.type]?.icon || '•'}</div>
            <div class="row-body">
              <div class="row-title">${esc(s.title)}</div>
              <div class="row-detail">${esc(s.detail)}</div>
              <div class="row-loc">📍 ${esc(s.location)}</div>
            </div>
          </div>`
          )
          .join('')}
      </div>`
      )
      .join('');
  }

  const saapumisetItems = rest.filter((s) => s.type !== 'tapahtuma');
  const tapahtumatItems = rest.filter((s) => s.type === 'tapahtuma');
  const saapumisetHtml = bandGroupsHtml(saapumisetItems);
  const tapahtumatHtml = bandGroupsHtml(tapahtumatItems);

  const listSlot = document.getElementById('list-slot');
  if (!saapumisetHtml && !tapahtumatHtml && !heroItems.length) {
    listSlot.innerHTML = '<div class="empty">Ei näkyvää juuri nyt tällä suodattimella.</div>';
  } else {
    listSlot.innerHTML =
      (saapumisetHtml ? `<div class="category-label">Saapumiset</div>${saapumisetHtml}` : '') +
      (tapahtumatHtml ? `<div class="category-label">Tapahtumat</div>${tapahtumatHtml}` : '');
  }
}

async function loadData() {
  try {
    const res = await fetch('./data.json?_=' + Date.now());
    if (res.ok) {
      rawData = await res.json();
      document.getElementById('subtitle').textContent = 'Kunnon Taksi · Tampere';
    } else {
      document.getElementById('subtitle').textContent = 'data.json ei löytynyt vielä';
    }
  } catch (e) {
    document.getElementById('subtitle').textContent = 'Datan haku epäonnistui';
  }
  render();
}

function startApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadData();
  setInterval(loadData, 120000);
  setInterval(render, 1000);
}

// Yksinkertainen yhteinen salasana estämään satunnaiset kävijät - ei oikeaa
// tietoturvaa (näkyy lähdekoodissa, data.json haettavissa suoraan omalla
// osoitteellaan siitä huolimatta). Vaihda salasana tästä tarvittaessa.
const KYYTITUTKA_SALASANA = 'kunnontaksi';

function tarkistaSalasana() {
  const syote = document.getElementById('gatePw').value;
  if (syote === KYYTITUTKA_SALASANA) {
    localStorage.setItem('kyytitutka_kirjautunut', 'kylla');
    startApp();
  } else {
    document.getElementById('gateError').textContent = 'Väärä salasana';
  }
}
document.getElementById('gateBtn').addEventListener('click', tarkistaSalasana);
document.getElementById('gatePw').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tarkistaSalasana();
});

if (localStorage.getItem('kyytitutka_kirjautunut') === 'kylla') {
  startApp();
}
</script>
</body>
</html>
