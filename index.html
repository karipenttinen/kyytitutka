<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyytitutka</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }
  body { background: #0D1017; color: #EDEFF3; }
  .wrap { max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .header { padding: 20px 16px 12px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .radar { position: relative; width: 34px; height: 34px; flex-shrink: 0; }
  .ring1 { position: absolute; inset: 0; border-radius: 999px; border: 1px solid rgba(232,169,77,0.4); }
  .ring2 { position: absolute; inset: 5px; border-radius: 999px; border: 1px solid rgba(232,169,77,0.25); }
  .sweep { position: absolute; inset: 0; border-radius: 999px; overflow: hidden; }
  .sweep-fill { position: absolute; inset: 0; background: conic-gradient(from 0deg, rgba(232,169,77,0.7), transparent 30%); }
  @media (prefers-reduced-motion: no-preference) { .sweep { animation: spin 4s linear infinite; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 999px; background: #E8A94D; }
  .title { font-weight: 800; font-size: 18px; }
  .subtitle { color: #6B7286; font-size: 11.5px; }
  .clock { color: #E8A94D; font-size: 15px; }

  .hero { margin: 4px 16px 16px; padding: 16px; border-radius: 14px; background: #161A24; border: 1px solid #262B38; }
  .hero-eta { color: #6B7286; font-size: 12px; margin-bottom: 8px; }
  .hero-row { display: flex; align-items: flex-start; gap: 12px; }
  .hero-icon { font-size: 20px; }
  .hero-title { font-weight: 700; font-size: 17px; color: #F5F6F8; }
  .hero-detail { color: #9CA2B4; font-size: 13.5px; margin-top: 2px; }
  .hero-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .loc { display: flex; align-items: center; gap: 4px; color: #6B7286; font-size: 12.5px; }

  .stat { padding: 0 16px 14px; color: #6B7286; font-size: 12.5px; }

  .tabs { display: flex; gap: 6px; padding: 0 16px 16px; overflow-x: auto; }
  .tab { padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid #262B38; color: #8A90A3; background: transparent; }
  .tab.active { border-color: rgba(232,169,77,0.5); color: #E8A94D; background: rgba(232,169,77,0.08); }

  .band-label { padding: 10px 16px 6px; font-size: 12px; font-weight: 700; }
  .list { border-top: 1px solid #20242F; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #20242F; }
  .row.soon { background: rgba(232,169,77,0.06); }
  .row-time { min-width: 46px; font-size: 13px; padding-top: 2px; color: #6B7286; }
  .row.soon .row-time, .row.soon .row-icon { color: #E8A94D; }
  .row-icon { padding-top: 2px; font-size: 15px; color: #6B7286; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-weight: 600; font-size: 14.5px; }
  .row-detail { color: #8A90A3; font-size: 13px; margin-top: 1px; }
  .row-loc { display: flex; align-items: center; gap: 4px; color: #5C6272; font-size: 12px; margin-top: 4px; }
  .bars { display: flex; align-items: center; gap: 2px; padding-top: 4px; }
  .bar { width: 4px; border-radius: 999px; background: #252A38; }
  .bar.on { background: #E8A94D; }

  .empty { padding: 32px 16px; color: #6B7286; font-size: 13.5px; text-align: center; }
  .footer-note { margin: 24px 16px 0; padding: 12px 14px; border-radius: 12px; border: 1px dashed #2A3040; color: #5C6272; font-size: 12.5px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="radar">
        <div class="ring1"></div>
        <div class="ring2"></div>
        <div class="sweep"><div class="sweep-fill"></div></div>
        <div class="dot"></div>
      </div>
      <div>
        <div class="title">Kyytitutka</div>
        <div class="subtitle" id="subtitle">Tampere · live-data</div>
      </div>
    </div>
    <div class="clock mono" id="clock">--.--.--</div>
  </div>

  <div id="hero-slot"></div>
  <div class="stat" id="stat-line"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list-slot"><div class="empty">Ladataan…</div></div>

  <div class="footer-note">
    Data päivittyy taustalla n. 15 min välein GitHub Actionin kautta. Jos lista näyttää tyhjältä pitkään, tarkista että Action on ehtinyt ajaa ainakin kerran ja että data.json löytyy samasta kansiosta kuin tämä sivu.
  </div>
</div>

<script>
const TYPE_META = {
  lento: { icon: '✈' },
  juna: { icon: '🚆' },
  bussi: { icon: '🚌' },
  tapahtuma: { icon: '🎉' },
};

const FILTERS = [
  { id: 'kaikki', label: 'Kaikki' },
  { id: 'lennot', label: 'Lennot' },
  { id: 'kaukoliikenne', label: 'Kaukoliikenne' },
  { id: 'tapahtumat', label: 'Tapahtumat' },
];

function matchesFilter(type, f) {
  if (f === 'kaikki') return true;
  if (f === 'lennot') return type === 'lento';
  if (f === 'kaukoliikenne') return type === 'juna' || type === 'bussi';
  if (f === 'tapahtumat') return type === 'tapahtuma';
  return true;
}

function getBand(delta) {
  if (delta <= -480) return null;
  if (delta <= 300) return 'nyt';
  if (delta <= 1500) return 'pian';
  if (delta <= 4500) return 'tunti';
  return 'myohemmin';
}
const BAND_ORDER = ['nyt', 'pian', 'tunti', 'myohemmin'];
const BAND_LABEL = { nyt: 'Saapuu juuri nyt', pian: 'Saapuu pian', tunti: 'Seuraavan tunnin aikana', myohemmin: 'Myöhemmin' };
const BAND_COLOR = { nyt: '#E8A94D', pian: '#E8A94D', tunti: '#9CA2B4', myohemmin: '#6B7286' };

let rawData = [];
let filter = 'kaikki';

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function fmtTime(unixSec) {
  const d = new Date(unixSec * 1000);
  return String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');
}

function bars(level) {
  return '<div class="bars">' + [1, 2, 3].map((i) =>
    `<div class="bar ${i <= level ? 'on' : ''}" style="height:${4 + i * 2}px"></div>`
  ).join('') + '</div>';
}

function render() {
  const now = Math.floor(Date.now() / 1000);
  document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8).replace(/:/g, '.');

  const withDelta = rawData
    .map((s) => ({ ...s, delta: s.time - now }))
    .filter((s) => getBand(s.delta) !== null);

  const filtered = withDelta.filter((s) => matchesFilter(s.type, filter)).sort((a, b) => a.delta - b.delta);
  const hero = filtered[0];
  const rest = hero ? filtered.slice(1) : [];

  document.getElementById('stat-line').textContent =
    withDelta.filter((s) => s.delta <= 4500).length + ' saapumista seuraavan tunnin aikana';

  document.getElementById('tabs').innerHTML = FILTERS.map((f) =>
    `<button class="tab ${f.id === filter ? 'active' : ''}" data-f="${f.id}">${f.label}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));

  document.getElementById('hero-slot').innerHTML = hero ? `
    <div class="hero">
      <div class="hero-eta">${hero.delta <= 0 ? 'Tapahtuu juuri nyt' : Math.round(hero.delta / 60) + ' min kuluttua'}</div>
      <div class="hero-row">
        <div class="hero-icon">${TYPE_META[hero.type]?.icon || '•'}</div>
        <div style="flex:1">
          <div class="hero-title">${esc(hero.title)}</div>
          <div class="hero-detail">${esc(hero.detail)}</div>
          <div class="hero-meta">
            <div class="loc">📍 ${esc(hero.location)}</div>
            ${bars(hero.demand)}
          </div>
        </div>
      </div>
    </div>` : '';

  const grouped = BAND_ORDER.map((band) => ({ band, items: rest.filter((s) => getBand(s.delta) === band) })).filter(
    (g) => g.items.length > 0
  );

  const listSlot = document.getElementById('list-slot');
  if (grouped.length === 0 && !hero) {
    listSlot.innerHTML = '<div class="empty">Ei näkyviä saapumisia juuri nyt tällä suodattimella.</div>';
  } else {
    listSlot.innerHTML = grouped
      .map(
        (g) => `
      <div class="band-label" style="color:${BAND_COLOR[g.band]}">${BAND_LABEL[g.band]}</div>
      <div class="list">
        ${g.items
          .map(
            (s) => `
          <div class="row ${s.delta <= 300 ? 'soon' : ''}">
            <div class="row-time mono">${fmtTime(s.time)}</div>
            <div class="row-icon">${TYPE_META[s.type]?.icon || '•'}</div>
            <div class="row-body">
              <div class="row-title">${esc(s.title)}</div>
              <div class="row-detail">${esc(s.detail)}</div>
              <div class="row-loc">📍 ${esc(s.location)}</div>
            </div>
            ${bars(s.demand)}
          </div>`
          )
          .join('')}
      </div>`
      )
      .join('');
  }
}

async function loadData() {
  try {
    const res = await fetch('./data.json?_=' + Date.now());
    if (res.ok) {
      rawData = await res.json();
      document.getElementById('subtitle').textContent = 'Tampere · live-data';
    } else {
      document.getElementById('subtitle').textContent = 'data.json ei löytynyt vielä';
    }
  } catch (e) {
    document.getElementById('subtitle').textContent = 'Datan haku epäonnistui';
  }
  render();
}

loadData();
setInterval(loadData, 120000);
setInterval(render, 1000);
</script>
</body>
</html>
